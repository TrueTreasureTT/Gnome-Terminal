worker_processes  1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json text/xml application/xml+rss text/javascript;

    # Upstream backend: uses docker-compose service name 'backend'
    upstream backend_ws {
        server backend:8765;
    }

    server {
        listen 80;
        server_name _;

        # Serve static frontend files
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # WebSocket proxy for /ws
        location /ws {
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # long running shells
            proxy_send_timeout 3600s;
        }

        # Optional: health endpoint proxied to backend if implemented
        location /health {
            proxy_pass http://backend_ws;
        }
    }
}
