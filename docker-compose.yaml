version: "3.12"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gnome-terminal-clone-backend:local
    environment:
      - PORT=8765
      # Set a default safe working dir inside the container — you can override per-session via control message.
      - DEFAULT_CWD=/home/worker/repo
    volumes:
      # Mount the repository (current host repo) into the container so spawned shells see the repo
      - ${PWD}:/home/worker/repo:rw
      # Mount your SSH keys read-only so git+ssh works in the PTY (be careful; it's your private key)
      - ${HOME}/.ssh:/home/worker/.ssh:ro
    ports:
      - "8765:8765"
    tty: true
    stdin_open: true

  frontend-dev:
    image: node:18
    working_dir: /app/frontend
    volumes:
      - ${PWD}/frontend:/app/frontend
      - /app/frontend/node_modules
    command: [ "bash", "-lc", "npm install --no-audit --no-fund && npm run dev -- --host" ]
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: gnome-terminal-clone-nginx:local
    depends_on:
      - backend
    ports:
      - "80:80"
    # If you want HTTPS locally, add 443 mapping and certificates
    restart: unless-stopped
