services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gnome-terminal-clone-backend:local
    environment:
      PORT: 8765
      DEFAULT_CWD: /home/worker/repo
    volumes:
      - ${PWD}:/home/worker/repo:rw
    ports:
      - "8765:8765"
    tty: true
    stdin_open: true

  frontend-dev:
    image: node:20
    working_dir: /app/frontend
    volumes:
      - ${PWD}/frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      TERMINAL_BACKEND_URL: ws://backend:8765
    command: ["bash", "-lc", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: gnome-terminal-clone-nginx:local
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
